name: Compilar Instalador Nativo iPhone (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios_ipa:
    name: Compilar Recordatorios-iOS.ipa en macOS (Xcode)
    runs-on: macos-latest

    steps:
      - name: Descargar código del proyecto
        uses: actions/checkout@v4

      - name: Instalar Flutter (Motor Impeller ARM64)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Preparar plataforma iOS y activos
        working-directory: recordatorios_flutter
        run: |
          flutter create --platforms=ios --org com.jose --project-name recordatorios .
          flutter pub get

      - name: Compilar aplicación nativa iOS sin firma (para Sideloadly / AltStore)
        working-directory: recordatorios_flutter
        run: |
          flutter build ios --release --no-codesign

      - name: Empaquetar archivo instalador Recordatorios-iOS.ipa
        working-directory: recordatorios_flutter/build/ios/iphoneos
        run: |
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 Recordatorios-iOS.ipa Payload

      - name: Subir instalador Recordatorios-iOS.ipa listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Recordatorios-iOS-Installer
          path: recordatorios_flutter/build/ios/iphoneos/Recordatorios-iOS.ipa
