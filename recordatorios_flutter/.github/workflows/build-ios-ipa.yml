name: Compilar Instalador iPhone (.ipa)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build_ios_ipa:
    name: Generar Recordatorios-iPhone.ipa en macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Compilar iOS sin firma para Sideloadly / AltStore
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Recordatorios-iPhone.ipa Payload

      - name: Subir instalador Recordatorios-iPhone.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Recordatorios-iPhone-IPA
          path: Recordatorios-iPhone.ipa
